<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IA Ayuda SalvandoOtare</title>
  <link href="style.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="chat-header">
      <div class="header-content">
        <div class="bot-avatar">🤖</div>
        <div class="header-info">
          <h1>SalvandoOtare Bot</h1>
          <p>Siempre disponible para ayudarte</p>
        </div>
        <div class="model-selector">
          <label for="geminiModel">Modelo:</label>
          <select id="geminiModel" class="model-dropdown">
            <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
            <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
            <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
            <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
          </select>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message bot-message">
        <div class="message-content">
          <p>¡Hola! 👋 Soy el Bot de SalvandoOtare. ¿En qué puedo ayudarte hoy?</p>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <div class="input-wrapper">
        <input 
          id="pregunta" 
          type="text" 
          class="chat-input" 
          placeholder="Escribe tu pregunta aquí..." 
          autocomplete="off"
        />
        <button class="send-btn" onclick="preguntar()">
          <span>📤</span>
        </button>
      </div>
      <p class="footer-text">Powered by Gemini</p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
