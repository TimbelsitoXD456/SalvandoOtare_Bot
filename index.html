<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Prompts - IA Intelligence</title>
  <link href="style.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-content">
        <div class="logo">
          <span class="logo-icon">⚡</span>
          <div class="logo-text">
            <h1>PromptGenerator</h1>
            <p>Prompts optimizados para cualquier IA</p>
          </div>
        </div>
        <div class="header-badge">v1.0</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Left Panel: Configuración -->
      <div class="config-panel">
        <h2>Configurar Prompt</h2>

        <!-- Selector de Modelo -->
        <div class="config-section">
          <label class="section-label">Modelo de IA</label>
          <select id="modeloSelector" class="selector-dropdown">
            <option value="">-- Selecciona un modelo --</option>
            <option value="chatgpt">ChatGPT (OpenAI)</option>
            <option value="gemini">Google Gemini</option>
            <option value="claude">Claude (Anthropic)</option>
            <option value="groq">Groq</option>
            <option value="meta">Meta IA (Llama)</option>
            <option value="canva">Canva IA</option>
          </select>
        </div>

        <!-- Selector de Plan -->
        <div class="config-section">
          <label class="section-label">Plan / Nivel</label>
          <div class="plan-selector">
            <label class="plan-option">
              <input type="radio" name="plan" value="free" checked>
              <span class="plan-label">
                <span class="plan-name">Free</span>
                <span class="plan-desc">Prompts básicos</span>
              </span>
            </label>
            <label class="plan-option">
              <input type="radio" name="plan" value="pro">
              <span class="plan-label">
                <span class="plan-name">Pro</span>
                <span class="plan-desc">Detallados</span>
              </span>
            </label>
            <label class="plan-option">
              <input type="radio" name="plan" value="premium">
              <span class="plan-label">
                <span class="plan-name">Premium</span>
                <span class="plan-desc">Muy complejos</span>
              </span>
            </label>
          </div>
        </div>

        <!-- Tipo de Tarea -->
        <div class="config-section">
          <label for="tipoTarea" class="section-label">Tipo de Tarea</label>
          <select id="tipoTarea" class="selector-dropdown">
            <option value="">-- Selecciona tipo --</option>
            <option value="creativo">🎨 Creativo</option>
            <option value="tecnico">💻 Técnico / Código</option>
            <option value="academico">📚 Académico</option>
            <option value="negocios">💼 Negocios</option>
            <option value="analisis">📊 Análisis / Investigación</option>
            <option value="redaccion">✍️ Redacción / Contenido</option>
          </select>
        </div>

        <!-- Input de Tarea -->
        <div class="config-section">
          <label for="descripcionTarea" class="section-label">Describe tu tarea</label>
          <textarea 
            id="descripcionTarea" 
            class="task-input" 
            placeholder="Ejemplo: Quiero un prompt para generar código en Python que..."
            rows="5"
          ></textarea>
        </div>

        <!-- Botón Generar -->
        <button class="btn-generate" onclick="generarPrompt()">
          <span class="btn-icon">✨</span>
          <span class="btn-text">Generar Prompt</span>
        </button>
      </div>

      <!-- Right Panel: Resultado -->
      <div class="result-panel">
        <div class="result-container" id="resultContainer">
          <div class="result-placeholder">
            <div class="placeholder-icon">📝</div>
            <h3>Tu prompt aparecerá aquí</h3>
            <p>Selecciona un modelo, plan y describe tu tarea, luego presiona "Generar Prompt"</p>
          </div>
        </div>

        <!-- Botón Copiar -->
        <button class="btn-copy" id="btnCopy" onclick="copiarPrompt()" style="display: none;">
          <span class="copy-icon">📋</span>
          <span class="copy-text">Copiar al portapapeles</span>
        </button>

        <!-- Indicador de Carga -->
        <div class="loading-indicator" id="loadingIndicator" style="display: none;">
          <div class="spinner"></div>
          <p>Generando prompt optimizado...</p>
        </div>

        <!-- Mensaje de Error -->
        <div class="error-message" id="errorMessage" style="display: none;"></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <p>Powered by Gemini 3.5 Flash-Lite | Optimizador de Prompts Inteligente</p>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
